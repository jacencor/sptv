<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>SPTV - Simple TV</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="vh-100 vw-100 m-0 p-0 position-relative">

    <div class="offcanvas offcanvas-start border-end border-secondary" tabindex="-1" id="sidebarChannels">
        <div class="offcanvas-header border-bottom border-dark">
            <h5 class="offcanvas-title text-light fw-bold">Canales</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
        <div class="offcanvas-body p-0 overflow-y-auto">
            <div id="channels-group" class="list-group list-group-flush">
            </div>
        </div>
    </div>

    <div class="w-100 h-100 d-flex justify-content-center align-items-center bg-black">
        <button id="openSidebar"
            class="btn btn-dark position-absolute top-0 start-0 m-3 z-3 shadow-sm border border-secondary"
            data-bs-toggle="offcanvas" data-bs-target="#sidebarChannels">
            <i class="fa fa-bars"></i>
        </button>

        <video id="video" class="w-100 h-100 object-fit-contain" controls autoplay playsinline
            poster="img/app/error.png"></video>
    </div>

    <!-- Contenedor de toasts (solo se queda el z-index, pero los estilos de posición ya están en Bootstrap) -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script defer type="module" src="js/main.js"></script>
</body>

</html>
